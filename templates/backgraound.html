<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart Refrigerator{% endblock %}</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.0/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --frost-blue: #caf0f8;
            --ice-blue: #90e0ef;
            --deep-blue: #00b4d8;
            --ocean-blue: #0077b6;
            --dark-blue: #03045e;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--frost-blue), var(--ice-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .bg-elements {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .snowflake {
            position: absolute;
            color: white;
            opacity: 0.6;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }
    </style>
</head>
<body>
    <div class="bg-elements" id="bgElements"></div>

    <div class="container-fluid py-5">
        {% block layout %}
            {% block content %}{% endblock %}
        {% endblock %}
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        function createSnowflakes() {
            const bgElements = document.getElementById('bgElements');
            const snowflakes = ['❄', '❅', '❆'];
            const numberOfElements = 50;

            for (let i = 0; i < numberOfElements; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.textContent = snowflakes[Math.floor(Math.random() * snowflakes.length)];
                snowflake.style.left = `${Math.random() * 100}%`;
                snowflake.style.animationDuration = `${Math.random() * 3 + 2}s`;
                snowflake.style.opacity = Math.random() * 0.6;
                snowflake.style.fontSize = `${Math.random() * 20 + 10}px`;
                bgElements.appendChild(snowflake);

                snowflake.addEventListener('animationend', () => {
                    snowflake.remove();
                    createSnowflakes();
                });
            }
        }

        createSnowflakes();

        {% block scripts %}
        {% endblock %}
    </script>
</body>
</html>
